  <text x="26" y="244" font-size="13" font-weight="normal" text-anchor="start" font-family="'SFMono-Regular', 'Consolas', 'Liberation Mono', 'Menlo', monospace"><tspan fill="#484f58">  </tspan><tspan fill="#79c0ff">messaging    </tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#a5d6ff">["RabbitMQ"]</tspan><tspan fill="#484f58">  # async, decoupled</tspan></text>
